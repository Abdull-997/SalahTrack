name: salah_focus
description: Prayer-first focus companion with local-first prayer tracking and safe distraction protection.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

flutter:
  uses-material-design: true
  assets:
    - assets/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  dio: ^5.11.0
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  # 14.0.3 pulls package_info_plus 10.x through its Linux implementation.
  geolocator: 14.0.2
  geocoding: ^3.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_compass: ^0.8.1
  intl: ^0.20.3
  in_app_review: ^2.0.12
  # Keep the win32 dependency compatible with device_info_plus 12.3.0.
  package_info_plus: ^9.0.1
  # 12.4.0+ directly references an iOS 26.1-only NSProcessInfo selector,
  # which does not compile when CI uses an older iOS 26 SDK.
  device_info_plus: 12.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
