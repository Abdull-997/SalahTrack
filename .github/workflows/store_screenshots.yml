name: Store screenshots

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture Android phone screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_8
          script: bash tool/generate_store_screenshots.sh android emulator-5554
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-android-phone
          path: store_screenshots/android/
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Select and boot simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          family = sys.argv[1]
          devices = [d for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable")]
          matching = [d for d in devices if d["name"].lower().startswith(family)]
          preferred = [d for d in matching if "Pro Max" in d["name"]] if family == "iphone" else [d for d in matching if "13-inch" in d["name"]]
          selected = (preferred or matching)
          if not selected: sys.exit(f"No available {family} simulator")
          print(selected[0]["udid"])
          ' '${{ matrix.family }}')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          echo "udid=$simulator" >> "$GITHUB_OUTPUT"
      - name: Capture iOS screenshots
        run: bash tool/generate_store_screenshots.sh ios '${{ steps.simulator.outputs.udid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-ios-${{ matrix.family }}
          path: store_screenshots/ios/
          if-no-files-found: error
