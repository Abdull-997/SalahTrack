name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Space-separated locale codes (start with: en de ar)'
        required: true
        default: 'en de ar'
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        timeout-minutes: 10
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android phone screenshots
        timeout-minutes: 110
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STORE_LOCALES: ${{ inputs.locales }}
        with:
          # Install the platform needed by compileSdk 36, with a stable phone image.
          api-level: 36
          system-image-api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: |
            adb devices
            bash tool/generate_store_screenshots.sh android emulator-5554
      - name: Android emulator diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          echo 'KVM:'
          ls -l /dev/kvm || true
          echo 'Installed Android platforms and system images:'
          sdkmanager --list_installed 2>&1 | grep -E 'platforms;android-|system-images;android-|emulator|platform-tools' || true
          echo 'AVDs:'
          emulator -list-avds || true
          echo 'Available Pixel profiles:'
          avdmanager list device 2>&1 | grep -i -A 3 'pixel_8' || true
          adb devices || true
      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-android-phone
          path: store_screenshots/android/
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        timeout-minutes: 10
        run: flutter pub get
      - name: Select and boot simulator
        id: simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          selected=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          family = sys.argv[1]
          devices = [d for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable")]
          matching = [d for d in devices if d["name"].lower().startswith(family)]
          preferred = [d for d in matching if "Pro Max" in d["name"]] if family == "iphone" else [d for d in matching if "13-inch" in d["name"]]
          selected = preferred or matching
          if not selected: sys.exit(f"No available {family} simulator")
          d = selected[0]
          print("|".join((d["name"], d["udid"], d["state"], d.get("deviceTypeIdentifier", "unknown"))))
          ' '${{ matrix.family }}')
          IFS='|' read -r name simulator state device_type <<< "$selected"
          echo "[Store Screenshots] Selected $name ($simulator), type $device_type, state $state"
          echo "udid=$simulator" >> "$GITHUB_OUTPUT"
          if [[ $state != Booted ]]; then xcrun simctl boot "$simulator"; fi
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl list devices booted
          flutter devices
          flutter devices --machine | python3 -c '
          import json, sys
          udid = sys.argv[1]
          devices = json.load(sys.stdin)
          if not any(d.get("id") == udid and d.get("isSupported", True) for d in devices):
              sys.exit(f"Flutter cannot see the selected booted simulator {udid}")
          ' "$simulator"
          xcrun simctl io "$simulator" screenshot /tmp/store-simulator-resolution.png
          sips -g pixelWidth -g pixelHeight /tmp/store-simulator-resolution.png
          dimensions=$(sips -g pixelWidth -g pixelHeight /tmp/store-simulator-resolution.png | awk '/pixelWidth:/ {w=$2} /pixelHeight:/ {h=$2} END {print w "x" h}')
          if [[ '${{ matrix.family }}' == iphone ]]; then
            case "$dimensions" in
              1260x2736|1290x2796|1320x2868|1284x2778|1242x2688) ;;
              *) echo "Unsupported App Store iPhone screenshot size: $dimensions" >&2; exit 1 ;;
            esac
          else
            case "$dimensions" in
              2064x2752|2048x2732) ;;
              *) echo "Unsupported App Store iPad screenshot size: $dimensions" >&2; exit 1 ;;
            esac
          fi
      - name: Capture iOS screenshots
        timeout-minutes: 110
        env:
          STORE_LOCALES: ${{ inputs.locales }}
          STORE_OUTPUT: store_screenshots/ios/${{ matrix.family }}
        run: bash tool/generate_store_screenshots.sh ios '${{ steps.simulator.outputs.udid }}'
      - name: iOS simulator diagnostics on failure
        if: failure() && steps.simulator.outputs.udid != ''
        timeout-minutes: 3
        shell: bash
        run: |
          device='${{ steps.simulator.outputs.udid }}'
          xcrun simctl list devices || true
          flutter devices || true
          xcrun simctl get_app_container "$device" com.salahtrack.app app || true
          xcrun simctl spawn "$device" log show --last 15m --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "com.salahtrack.app"' 2>&1 | tail -250 || true
          xcrun simctl bootstatus "$device" -b || true
      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-ios-${{ matrix.family }}
          path: store_screenshots/ios/${{ matrix.family }}/
          if-no-files-found: warn
