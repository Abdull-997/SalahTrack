name: Build iOS (SalahTrack)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    # App Store Connect requires Xcode 26 / the iOS 26 SDK for submissions.
    runs-on: macos-26

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Flutter SDK einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter-, Xcode- und SDK-Versionen prüfen
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Abhängigkeiten laden und prüfen
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: iOS App kompilieren (Release, nicht signiert)
        run: flutter build ios --release --no-codesign

      - name: Nicht signierten Build als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SalahTrack-iOS-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
